name: Build COSMIC CE packages

on:
  workflow_call:
    inputs:
      format:
        required: true
        type: string
      component:
        type: string
        default: ''
      channel:
        type: string
        default: canary
      publish-canary:
        type: boolean
        default: false
    secrets:
      apt-signing-key:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sources:
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.matrix.outputs.components }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: matrix
        env:
          COMPONENT: ${{ inputs.component }}
          FORMAT: ${{ inputs.format }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          components=$(git ls-files --stage | awk '$1 == "160000" {print $4}' | jq -Rsc 'split("\n") | map(select(length > 0))')
          if [[ -n "$COMPONENT" ]]; then
            components=$(jq -c --arg component "$COMPONENT" 'map(select(. == $component))' <<< "$components")
          fi
          if ! jq -e 'length > 0' <<< "$components" >/dev/null; then
            printf 'Unknown submodule: %s\n' "$COMPONENT" >&2
            exit 1
          fi
          case "$FORMAT" in
            deb|rpm) ;;
            *) exit 1 ;;
          esac
          case "$CHANNEL" in
            canary|stable) ;;
            *) exit 1 ;;
          esac
          printf 'components=%s\n' "$components" >> "$GITHUB_OUTPUT"

  build:
    needs: sources
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.sources.outputs.components) }}
    with:
      component: ${{ matrix.component }}
      format: ${{ inputs.format }}
      channel: ${{ inputs.channel }}
      publish-canary: ${{ inputs.publish-canary }}
    secrets:
      apt-signing-key: ${{ secrets.apt-signing-key }}

  verify-rpms:
    needs: build
    if: >-
      inputs.format == 'rpm' &&
      (inputs.component == '' || inputs.component == 'cosmic-viewer')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: packages
      - name: Check that Viewer installs with Fedora dependencies
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" quay.io/fedora/fedora:45 \
            bash -euc 'dnf5 -y --setopt=tsflags=test --setopt=install_weak_deps=False install /packages/rpm-cosmic-viewer/*.rpm'
      - name: Check the desktop RPM transaction against Fedora repositories
        if: inputs.component == ''
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" quay.io/fedora/fedora:45 \
            bash -euc 'dnf5 -y --setopt=tsflags=test install /packages/rpm-*/*.rpm'
