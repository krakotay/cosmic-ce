name: COSMIC CE Packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel for a complete build
        type: choice
        options: [canary, stable]
        default: canary
      component:
        description: Submodule to build (empty builds the desktop)
        type: string
      format:
        description: Package format (single-format builds are artifacts only)
        type: choice
        options: [both, deb, rpm]
        default: both
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cosmic-ce-packages-${{ github.ref }}-${{ inputs.channel || 'canary' }}-${{ inputs.component || 'desktop' }}-${{ inputs.format || 'both' }}
  cancel-in-progress: false

jobs:
  sources:
    if: >-
      github.repository == 'krakotay/cosmic-ce' &&
      (github.event_name == 'workflow_dispatch' || vars.COSMIC_CE_CANARY_ON_PUSH == 'true')
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.matrix.outputs.components }}
      formats: ${{ steps.matrix.outputs.formats }}
      channel: ${{ steps.matrix.outputs.channel }}
      publish: ${{ steps.matrix.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: matrix
        env:
          COMPONENT: ${{ inputs.component }}
          FORMAT: ${{ inputs.format || 'both' }}
          CHANNEL: ${{ inputs.channel || 'canary' }}
        run: |
          components=$(git ls-files --stage | awk '$1 == "160000" {print $4}' | jq -Rsc 'split("\n") | map(select(length > 0))')
          if [[ -n "$COMPONENT" ]]; then
            components=$(jq -c --arg component "$COMPONENT" 'map(select(. == $component))' <<< "$components")
          fi
          if ! jq -e 'length > 0' <<< "$components" >/dev/null; then
            printf 'Unknown submodule: %s\n' "$COMPONENT" >&2
            exit 1
          fi
          case "$FORMAT" in
            both) formats='["deb","rpm"]' ;;
            deb) formats='["deb"]' ;;
            rpm) formats='["rpm"]' ;;
            *) exit 1 ;;
          esac
          case "$CHANNEL" in
            canary|stable) ;;
            *) exit 1 ;;
          esac
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/master && -z "$COMPONENT" && "$FORMAT" == both ]]; then
            publish=true
          fi
          printf 'components=%s\nformats=%s\nchannel=%s\npublish=%s\n' "$components" "$formats" "$CHANNEL" "$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPONENT: ${{ matrix.component }}
      FORMAT: ${{ matrix.format }}
      IMAGE: ${{ matrix.format == 'deb' && 'ubuntu:24.04' || 'quay.io/fedora/fedora:45' }}
      CHANNEL: ${{ needs.sources.outputs.channel }}
      SCCACHE_CACHE_SIZE: 128M
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.sources.outputs.components) }}
        format: ${{ fromJSON(needs.sources.outputs.formats) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the pinned component
        run: |
          git submodule update --init --recursive --depth 1 -- "$COMPONENT"
          if [[ -f "$COMPONENT/.gitattributes" ]] && grep -q filter=lfs "$COMPONENT/.gitattributes"; then
            git -C "$COMPONENT" lfs pull
          fi
      - name: Prepare the package container and cache key
        id: container
        run: |
          docker pull "$IMAGE"
          mkdir -p "$RUNNER_TEMP/package-sccache"
          if [[ ! -f "$COMPONENT/Cargo.lock" ]]; then
            exit 0
          fi
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          source_sha=$(git -C "$COMPONENT" rev-parse HEAD)
          prefix="packages-sccache-v1-${{ runner.arch }}-$FORMAT-$COMPONENT-"
          packaging=${{ hashFiles('scripts/build-canary-deb.sh', 'scripts/build-fedora-rpm.sh', 'packaging/fedora/**', 'packaging/cosmic-sound-theme/**') }}
          printf 'prefix=%s\nsource=%s\nkey=%s\n' "$prefix" "$prefix$source_sha-" \
            "$prefix$source_sha-${image_id#sha256:}-$packaging" >> "$GITHUB_OUTPUT"
      # Branch builds can restore master caches. Use the compiler cache with
      # the current run's package versions and the selected distro's build flags.
      - name: Restore the package compiler cache
        if: steps.container.outputs.key != ''
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/package-sccache
          key: ${{ steps.container.outputs.key }}
          restore-keys: |
            ${{ steps.container.outputs.source }}
            ${{ steps.container.outputs.prefix }}
      - name: Build ${{ matrix.format }} packages
        run: |
          case "$FORMAT" in
            deb) script=build-canary-deb.sh ;;
            rpm) script=build-fedora-rpm.sh ;;
          esac
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/package-sccache:/sccache" \
            -e SCCACHE_DIR=/sccache -e SCCACHE_CACHE_SIZE \
            -e COMPONENT -e CHANNEL -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT \
            "$IMAGE" bash "/src/scripts/$script"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.format }}-${{ matrix.component }}
          path: canary-${{ matrix.format }}s/*.${{ matrix.format }}
          if-no-files-found: error
          compression-level: 0
      - name: Make the compiler cache readable by the runner
        if: github.ref == 'refs/heads/master' && steps.container.outputs.key != '' && steps.compiler-cache.outputs.cache-hit != 'true'
        id: cache-owner
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/package-sccache"
      - name: Save the package compiler cache
        if: steps.cache-owner.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/package-sccache
          key: ${{ steps.container.outputs.key }}

  verify-rpms:
    needs: [sources, build]
    if: >-
      contains(fromJSON(needs.sources.outputs.formats), 'rpm') &&
      (needs.sources.outputs.publish == 'true' || needs.sources.outputs.components == '["cosmic-viewer"]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: packages
      - name: Check that Viewer installs with Fedora dependencies
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" quay.io/fedora/fedora:45 \
            bash -euc 'dnf5 -y --setopt=tsflags=test --setopt=install_weak_deps=False install /packages/rpm-cosmic-viewer/*.rpm'
      - name: Check the desktop RPM transaction against Fedora repositories
        if: needs.sources.outputs.publish == 'true'
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" quay.io/fedora/fedora:45 \
            bash -euc 'dnf5 -y --setopt=tsflags=test install /packages/rpm-*/*.rpm'

  archive:
    needs: [sources, verify-rpms]
    if: needs.sources.outputs.publish == 'true' && needs.sources.outputs.channel == 'canary'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: canary-packages
      - name: Create and validate the signed APT archive
        env:
          APT_SIGNING_KEY: ${{ secrets.COSMIC_CE_APT_SIGNING_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils
          bash scripts/publish-canary-apt.sh canary-packages canary-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: canary-site

  publish:
    needs: archive
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [sources, verify-rpms, publish]
    if: >-
      ${{ !cancelled() && needs.sources.outputs.publish == 'true' &&
      needs.verify-rpms.result == 'success' &&
      (needs.sources.outputs.channel == 'stable' || needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '{deb,rpm}-*'
          path: packages
      - name: Publish packages and installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.COSMIC_CE_APT_SIGNING_KEY }}
          CHANNEL: ${{ needs.sources.outputs.channel }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          bash scripts/release-packages.sh packages "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$CHANNEL"
