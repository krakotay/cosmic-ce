name: COSMIC CE Packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel for a complete build
        type: choice
        options: [canary, stable]
        default: canary
      component:
        description: Submodule to build (empty builds the desktop)
        type: string
      format:
        description: Package format (single-format builds are artifacts only)
        type: choice
        options: [both, deb, rpm]
        default: both

permissions:
  contents: read

concurrency:
  group: cosmic-ce-packages-${{ github.ref }}-${{ inputs.channel }}-${{ inputs.component || 'desktop' }}-${{ inputs.format }}
  cancel-in-progress: false

jobs:
  debs:
    if: github.repository == 'krakotay/cosmic-ce' && inputs.format != 'rpm'
    uses: ./.github/workflows/build-packages.yml
    with:
      format: deb
      channel: ${{ inputs.channel }}
      component: ${{ inputs.component }}

  rpms:
    if: github.repository == 'krakotay/cosmic-ce' && inputs.format != 'deb'
    uses: ./.github/workflows/build-packages.yml
    with:
      format: rpm
      channel: ${{ inputs.channel }}
      component: ${{ inputs.component }}

  publish-apt:
    needs: debs
    if: github.ref == 'refs/heads/master' && inputs.channel == 'canary' && inputs.component == '' && inputs.format == 'both'
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      apt: true
    secrets:
      apt-signing-key: ${{ secrets.COSMIC_CE_APT_SIGNING_KEY }}

  release:
    needs: [debs, rpms]
    if: github.ref == 'refs/heads/master' && inputs.component == '' && inputs.format == 'both'
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: write
    with:
      channel: ${{ inputs.channel }}
    secrets:
      apt-signing-key: ${{ secrets.COSMIC_CE_APT_SIGNING_KEY }}
