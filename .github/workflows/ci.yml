# Use Arch to test build outside of Ubuntu/Pop.
#
# Tests with recent version of dependencies. Another testson a different
# distro could be used to test for lowest supported.
#
# A minimal image should also help to confirm what dependencies are needed.

name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: '0 7 * * *' # Midnight MST daily

permissions:
  contents: read

concurrency:
  # Keep a release upload in progress when a newer commit starts building.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: List parallel build groups
      id: groups
      run: |
        groups=$(cut -f2 scripts/sysext-components.tsv | sort -u | jq -Rsc 'split("\n")[:-1]')
        echo "groups=$groups" >> "$GITHUB_OUTPUT"

  build:
    name: Build and stage (${{ matrix.group }})
    needs: plan
    runs-on: ubuntu-latest
    concurrency:
      group: ci-arch-${{ github.event_name }}-${{ github.ref }}-${{ matrix.group }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      BUILD_GROUP: ${{ matrix.group }}
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 512M
    container:
      image: archlinux:base-devel
    steps:
    - run: >
        pacman --noconfirm --needed -Syu
        cargo
        cmake
        clang
        desktop-file-utils
        git
        git-lfs
        gtk3
        gtk4
        just
        libdisplay-info
        libinput
        libxkbcommon
        llvm
        mesa
        meson
        pipewire
        pulseaudio
        sccache
        seatd
        wayland
        lld
        expat
        fontconfig
        freetype2
        flatpak
        nasm
        zstd
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    # Safe directory behavior seems to have issues with `container:`
    # https://github.com/actions/checkout/issues/915
    - run: git config --global --add safe.directory '*'
    - name: Fingerprint component and toolchain inputs
      id: inputs
      run: |
        mapfile -t components < <(awk -v group="$BUILD_GROUP" '$2 == group {print $1}' scripts/sysext-components.tsv)
        test "${#components[@]}" -gt 0
        sources=$(git ls-tree HEAD -- "${components[@]}" | sha256sum | cut -d ' ' -f 1)
        environment=$(LC_ALL=C pacman -Q | sha256sum | cut -d ' ' -f 1)
        compiler=$({ rustc -vV; gcc --version; clang --version; sccache --version; } | sha256sum | cut -d ' ' -f 1)
        recipes=$(git rev-parse HEAD:justfile HEAD:scripts/sysext-components.tsv HEAD:.github/workflows/ci.yml)
        digest=$(printf '%s\n' "$sources" "$environment" "$compiler" "$recipes" | sha256sum | cut -d ' ' -f 1)
        compiler_key="arch-sccache-v2-${{ runner.arch }}-$BUILD_GROUP-$environment-$compiler-"
        {
          echo "components=${components[*]}"
          echo "installed=arch-sysext-v2-${{ runner.arch }}-$BUILD_GROUP-$digest"
          echo "compiler-prefix=$compiler_key"
          echo "compiler-key=$compiler_key$sources"
        } >> "$GITHUB_OUTPUT"
        echo "SCCACHE_DIR=$GITHUB_WORKSPACE/build/ci-sccache" >> "$GITHUB_ENV"
    # Scheduled runs rebuild staging files while still using the compiler cache.
    - name: Restore installed component files
      id: installed
      uses: actions/cache/restore@v5
      with:
        path: build/sysext-fragments
        key: ${{ steps.inputs.outputs.installed }}
        lookup-only: ${{ github.event_name == 'schedule' }}
    - name: Check out the pinned components and their assets
      if: steps.installed.outputs.cache-hit != 'true' || github.event_name == 'schedule'
      id: prepare
      env:
        COMPONENTS: ${{ steps.inputs.outputs.components }}
      run: |
        read -ra components <<< "$COMPONENTS"
        GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --recursive --depth 1 --jobs 4 -- "${components[@]}"
        {
          echo 'workspaces<<EOF'
          for component in "${components[@]}"; do
            if [[ -f "$component/.gitattributes" ]] && grep -q filter=lfs "$component/.gitattributes"; then
              git -C "$component" lfs pull >&2
            fi
            if [ -f "$component/Cargo.toml" ]; then
              printf '%s\n' "$component"
            fi
          done
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - name: Cache Cargo dependencies
      if: steps.prepare.outcome == 'success'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: arch-sysext-${{ matrix.group }}
        workspaces: ${{ steps.prepare.outputs.workspaces }}
        cache-targets: false
        cache-bin: false
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - name: Restore the Arch compiler cache
      if: steps.prepare.outcome == 'success'
      id: compiler-cache
      uses: actions/cache/restore@v5
      with:
        path: build/ci-sccache
        key: ${{ steps.inputs.outputs.compiler-key }}
        restore-keys: ${{ steps.inputs.outputs.compiler-prefix }}
    - name: Build and install each component in staging
      if: steps.prepare.outcome == 'success'
      id: build
      env:
        COMPONENTS: ${{ steps.inputs.outputs.components }}
      run: |
        read -ra components <<< "$COMPONENTS"
        mkdir -p build/sysext-fragments
        stage="$GITHUB_WORKSPACE/cosmic-sysext"
        for component in "${components[@]}"; do
          echo "::group::$component"
          just _build-component "$component"
          mkdir -p "$stage"
          just _install-component "$component" "$stage" /usr
          tar -I 'zstd -T2 -1' -cf "build/sysext-fragments/$component.tar.zst" -C "$stage" .
          rm -rf -- "$stage" "$component/target"
          echo "::endgroup::"
        done
    - name: Show sccache statistics
      if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
      run: sccache --show-stats
    - uses: actions/upload-artifact@v4
      with:
        name: sysext-fragments-${{ matrix.group }}
        path: build/sysext-fragments/*.tar.zst
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
        overwrite: true
    - name: Save the Arch compiler cache
      if: github.ref == 'refs/heads/master' && steps.build.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: build/ci-sccache
        key: ${{ steps.inputs.outputs.compiler-key }}
    - name: Save the installed component files
      if: github.ref == 'refs/heads/master' && steps.build.outcome == 'success' && steps.installed.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: build/sysext-fragments
        key: ${{ steps.inputs.outputs.installed }}

  Test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
    - run: pacman --noconfirm --needed -Syu git just zstd
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - run: git config --global --add safe.directory '*'
    - uses: actions/download-artifact@v4
      with:
        pattern: sysext-fragments-*
        path: build/sysext-fragments
        merge-multiple: true
    - name: Assemble the system extension
      run: |
        mkdir -p cosmic-sysext
        while read -r component group; do
          tar --zstd -xpf "build/sysext-fragments/$component.tar.zst" -C cosmic-sysext
        done < scripts/sysext-components.tsv
        just _sysext-metadata "$GITHUB_WORKSPACE/cosmic-sysext"

  debs:
    if: github.repository == 'krakotay/cosmic-ce' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build-packages.yml
    permissions:
      contents: write
    with:
      format: deb
      publish-canary: true

  rpms:
    if: github.repository == 'krakotay/cosmic-ce' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build-packages.yml
    permissions:
      contents: write
    with:
      format: rpm
      publish-canary: true

  publish-apt:
    needs: debs
    if: ${{ !cancelled() && (needs.debs.result == 'success' || needs.debs.result == 'failure') }}
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      apt: true
    secrets:
      apt-signing-key: ${{ secrets.COSMIC_CE_APT_SIGNING_KEY }}

  release:
    needs: [debs, rpms]
    if: >-
      !cancelled() && (needs.debs.result == 'success' || needs.debs.result == 'failure' ||
      needs.rpms.result == 'success' || needs.rpms.result == 'failure')
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: write
    secrets:
      apt-signing-key: ${{ secrets.COSMIC_CE_APT_SIGNING_KEY }}
