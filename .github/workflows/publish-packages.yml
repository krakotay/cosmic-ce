name: Publish COSMIC CE packages

on:
  workflow_call:
    inputs:
      apt:
        type: boolean
        default: false
      channel:
        type: string
        default: canary
      package-run:
        type: string
        default: ''
    secrets:
      apt-signing-key:
        required: true

defaults:
  run:
    shell: bash

jobs:
  apt:
    if: inputs.apt && github.repository == 'krakotay/cosmic-ce' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    concurrency:
      group: cosmic-ce-publish-apt
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: mkdir -p packages
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: packages
      - name: Create and validate the signed APT archive
        id: archive
        env:
          APT_SIGNING_KEY: ${{ secrets.apt-signing-key }}
        run: |
          if ! compgen -G 'packages/deb-*/*.deb' >/dev/null; then
            echo 'No successful DEBs to publish.'
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils
          bash scripts/publish-canary-apt.sh packages canary-site
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: steps.archive.outputs.ready == 'true'
        with:
          name: github-pages-${{ github.run_attempt }}
          path: canary-site
      - name: Deploy the Canary APT archive
        if: steps.archive.outputs.ready == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  release:
    if: ${{ !inputs.apt && github.repository == 'krakotay/cosmic-ce' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: cosmic-ce-publish-${{ inputs.channel }}
      queue: max
    steps:
      - name: Resolve the package source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_RUN: ${{ inputs.package-run }}
        run: |
          sha=$GITHUB_SHA
          run=$GITHUB_RUN_ID
          if [[ -n "$PACKAGE_RUN" ]]; then
            [[ "$CHANNEL" == canary && "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
            run=$PACKAGE_RUN
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -er \
              --arg repo "$GITHUB_REPOSITORY" \
              'select(.event == "push" and .head_branch == "master" and .status == "completed" and
              .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo) | .head_sha')
          fi
          printf 'sha=%s\nrun=%s\n' "$sha" "$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: mkdir -p packages
      - uses: actions/download-artifact@v4
        with:
          pattern: '{deb,rpm}-*'
          path: packages
          github-token: ${{ inputs.package-run != '' && github.token || '' }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Publish packages and installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.apt-signing-key }}
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_RUN: ${{ steps.source.outputs.run }}
          PACKAGE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          bash scripts/release-packages.sh packages "$PACKAGE_SHA" "$PACKAGE_RUN" "$GITHUB_REPOSITORY" "$CHANNEL"
